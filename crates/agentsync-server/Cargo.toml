[package]
name = "agentsync-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentsync-sync-protocol.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
tempfile.workspace = true
libc.workspace = true
subtle = "2"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json.workspace = true
