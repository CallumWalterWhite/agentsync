[package]
name = "agentsync-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "agentsync"
path = "src/main.rs"

[dependencies]
agentsync-sync-client.workspace = true
agentsync-sync-protocol.workspace = true
agentsync-crypto.workspace = true
tempfile.workspace = true
agentsync-core.workspace = true
agentsync-provider-api.workspace = true
agentsync-provider-claude.workspace = true
agentsync-provider-codex.workspace = true
agentsync-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
age = { version = "0.11", default-features = false }
axum = "0.8"
agentsync-server.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
sha2.workspace = true

