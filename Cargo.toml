[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
agentsync-core = { path = "crates/agentsync-core" }
agentsync-provider-api = { path = "crates/agentsync-provider-api" }
agentsync-provider-claude = { path = "crates/agentsync-provider-claude" }
agentsync-provider-codex = { path = "crates/agentsync-provider-codex" }
agentsync-storage = { path = "crates/agentsync-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
tracing = "0.1"

